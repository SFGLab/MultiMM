[Main]

; ── Platform ──────────────────────────────────────────────────────────────────
PLATFORM = OpenCL

; ── Region of interest ────────────────────────────────────────────────────────
CHROM     = chr1
LOC_START = 160_000_000
LOC_END   = 173_000_000

; ── Initial structure ─────────────────────────────────────────────────────────
INITIAL_STRUCTURE_TYPE = rw

; ── Input data ────────────────────────────────────────────────────────────────
; Loops — commented out; Hi-C force is used as the structural restraint instead
LOOPS_PATH = /home/blackpianocat/Data/method_paper_data/ENCSR184YZV_CTCF_ChIAPET/LHG0052H_loops_cleaned_th10_2.bedpe

; Compartment data — not needed for a pure Hi-C force run
COMPARTMENT_PATH = /home/blackpianocat/Data/ENCODE/ENCSR968KAY_HiC/ENCFF412CDH_comps.bigWig

; Hi-C contact force (Boltzmann-inversion PMF — the only restraint type)
; HIC_PATH          = /home/blackpianocat/Data/ENCODE/ENCSR968KAY_HiC/ENCFF256UOW.hic
HIC_USE_FORCE     = False
HIC_BLOCK_COPOLYMER = False
HIC_NORMALIZATION = KR
HIC_K_SCALE       = 40.0
HIC_BOLTZMANN_ALPHA = 4.0
HIC_NOISE_INTENSITY = 0.2
HIC_FORCE_OE = False
HIC_MAX_GAP       = 10

; ── Output ────────────────────────────────────────────────────────────────────
OUT_PATH = tmp/test

; ── Bead resolution ───────────────────────────────────────────────────────────
N_BEADS = 5000

; ── Chromosome shuffling ──────────────────────────────────────────────────────
SHUFFLE_CHROMS = False

; ── Force field ───────────────────────────────────────────────────────────────
EV_USE_EXCLUDED_VOLUME    = True
EV_FORCE_TYPE             = powerlaw
EV_EPSILON               = 200.0
EV_POWER                  = 6.0

POL_USE_HARMONIC_BOND     = True
POL_USE_HARMONIC_ANGLE    = True
; Loop extrusion — disabled (no LOOPS_PATH); Hi-C force drives folding
LE_USE_HARMONIC_BOND      = False

; Nuclear container — not needed for a single region
SC_USE_SPHERICAL_CONTAINER = False

; Chromosome-level compaction — not applicable at region scale
CHB_USE_CHROMOSOMAL_BLOCKS = False

; Compartment forces — disabled (no COMPARTMENT_PATH)
COB_USE_COMPARTMENT_BLOCKS    = True
SCB_USE_SUBCOMPARTMENT_BLOCKS = False
IBL_USE_B_LAMINA_INTERACTION  = False

; Central force — not applicable for region runs
CF_USE_CENTRAL_FORCE = False

; Nucleosome interpolation — disable unless ATACSEQ_PATH is provided
NUC_DO_INTERPOLATION = False

; ── Simulation ────────────────────────────────────────────────────────────────
SIM_RUN_MD          = True
SIM_INTEGRATOR_TYPE = langevin
SIM_N_STEPS         = 10000
SIM_SAMPLING_STEP   = 100
TRJ_FRAMES          = 100
SIM_INTEGRATOR_STEP = 10 femtosecond
SIM_FRICTION_COEFF  = 0.1

; ── Ensemble ──────────────────────────────────────────────────────────────────
GENERATE_ENSEMBLE = False
N_ENSEMBLE        = 5
DOWNSAMPLING_PROB = 1.0
