[Main]

; ── Platform ──────────────────────────────────────────────────────────────────
PLATFORM = OpenCL

; ── Region of interest ────────────────────────────────────────────────────────
CHROM     = chr1
LOC_START = 10_000_000
LOC_END   = 12_950_000

; ── Initial structure ─────────────────────────────────────────────────────────
INITIAL_STRUCTURE_TYPE = rw

; ── Input data ────────────────────────────────────────────────────────────────
; Loops — commented out; Hi-C force is used as the structural restraint instead
;LOOPS_PATH = /home/blackpianocat/Data/method_paper_data/ENCSR184YZV_CTCF_ChIAPET/LHG0052H_loops_cleaned_th10_2.bedpe

; Compartment data — not needed for a pure Hi-C force run
;COMPARTMENT_PATH = /home/blackpianocat/Data/Trios/HiChIP/HiChIP_Subcompartments/calder_subc_50k/bed/HG00513_30.bed

; Hi-C contact force
HIC_PATH          = /home/blackpianocat/Data/ENCODE/ENCSR968KAY_HiC/ENCFF256UOW.hic
HIC_USE_FORCE     = True
HIC_NORMALIZATION = KR
; HIC_KERNEL: gaussian (default) | power_law | sigmoid | exponential | erfc | rouse
; Each kernel's own extra parameter is named HIC_<KERNEL>_*  below and only
; takes effect when that kernel is selected (e.g. HIC_GAUSSIAN_SIGMA only
; matters when HIC_KERNEL=gaussian).
HIC_KERNEL        = gaussian
HIC_K_SCALE       = 20.0
; HIC_POWERLAW_ALPHA: only used when HIC_KERNEL=power_law/sigmoid
HIC_POWERLAW_ALPHA    = 3.0
; HIC_GAUSSIAN_SIGMA: only used when HIC_KERNEL=gaussian (default: r_comp)
;HIC_GAUSSIAN_SIGMA   = 0.15
; HIC_ERFC_SIGMA: only used when HIC_KERNEL=erfc (default: 0.3 * r_comp)
;HIC_ERFC_SIGMA       = 0.05
; HIC_ROUSE_KUHN_LENGTH: only used when HIC_KERNEL=rouse (default: r_comp)
;HIC_ROUSE_KUHN_LENGTH = 0.15
; HIC_WEIGHT_POWER: force ~ c_ij^HIC_WEIGHT_POWER; 1.0 = proportional to contact strength
HIC_WEIGHT_POWER  = 1.0
; HIC_THRESHOLD: sparsity cutoff only, not a hardness knob
HIC_THRESHOLD     = 0.01
HIC_MAX_GAP       = 10

; ── Output ────────────────────────────────────────────────────────────────────
OUT_PATH = tmp/test_hic

; ── Bead resolution ───────────────────────────────────────────────────────────
N_BEADS = 1000

; ── Chromosome shuffling ──────────────────────────────────────────────────────
SHUFFLE_CHROMS = False

; ── Force field ───────────────────────────────────────────────────────────────
EV_USE_EXCLUDED_VOLUME    = True
EV_FORCE_TYPE             = powerlaw
EV_EPSILON               = 100.0
EV_POWER                  = 6.0

POL_USE_HARMONIC_BOND     = True
POL_USE_HARMONIC_ANGLE    = True

; Loop extrusion — disabled (no LOOPS_PATH); Hi-C force drives folding
LE_USE_HARMONIC_BOND      = False

; Nuclear container — not needed for a single region
SC_USE_SPHERICAL_CONTAINER = False

; Chromosome-level compaction — not applicable at region scale
CHB_USE_CHROMOSOMAL_BLOCKS = False

; Compartment forces — disabled (no COMPARTMENT_PATH)
COB_USE_COMPARTMENT_BLOCKS    = False
SCB_USE_SUBCOMPARTMENT_BLOCKS = False
IBL_USE_B_LAMINA_INTERACTION  = False

; Central force — not applicable for region runs
CF_USE_CENTRAL_FORCE = False

; Nucleosome interpolation — disable unless ATACSEQ_PATH is provided
NUC_DO_INTERPOLATION = False

; ── Simulation ────────────────────────────────────────────────────────────────
SIM_RUN_MD          = True
SIM_INTEGRATOR_TYPE = langevin
SIM_N_STEPS         = 10000
SIM_SAMPLING_STEP   = 50
TRJ_FRAMES          = 1000
SIM_INTEGRATOR_STEP = 1 femtosecond

; ── Ensemble ──────────────────────────────────────────────────────────────────
GENERATE_ENSEMBLE = False
N_ENSEMBLE        = 5
DOWNSAMPLING_PROB = 1.0
