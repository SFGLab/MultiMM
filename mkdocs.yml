site_name: MultiMM
docs_dir: docs
site_description: Multiscale chromatin modelling from nucleosomes to whole genomes
repo_url: https://github.com/SFGLab/MultiMM
repo_name: SFGLab/MultiMM

theme:
  name: material
  logo: assets/multimm_icon_header.svg
  favicon: assets/multimm_icon.svg
  palette:
    scheme: default        # light mode only
    primary: custom        # colours defined in stylesheets/extra.css
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

nav:
  - Intro:
      - Home: index.md
      - Installation: intro/installation.md
      - Inspiration: intro/inspiration.md
  - The Model:
      - Overview: model/index.md
      - Initial structure: model/initial-structure.md
      - Units and scales: model/scales.md
      - Backbone: model/backbone.md
      - Loops: model/loops.md
      - Compartments: model/compartments.md
      - Hi-C force: model/hic-force.md
      - Nuclear envelope and lamina: model/lamina.md
      - Minimisation and dynamics: model/dynamics.md
      - Advanced options: model/advanced.md
  - Reference:
      - Running MultiMM: reference/running.md
      - Writing a config file: reference/config-file.md
      - Arguments: reference/arguments.md
      - Input data: reference/input.md
      - Output: reference/output.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
