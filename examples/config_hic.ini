[Main]

; ── Platform ──────────────────────────────────────────────────────────────────
PLATFORM = OpenCL

; ── Region of interest ────────────────────────────────────────────────────────
CHROM     = chr1
LOC_START = 10000000
LOC_END   = 28000000

; ── Output ────────────────────────────────────────────────────────────────────
OUT_PATH = results/hic_region

; ── Bead resolution ───────────────────────────────────────────────────────────
N_BEADS = 500
INITIAL_STRUCTURE_TYPE = circle

; ── Hi-C contact force (NEW) ──────────────────────────────────────────────────
; Supply a .hic (Juicer) or .cool/.mcool (cooler) file.
; read_hic.py will auto-detect format, pick the best resolution, and
; resize the matrix to N_BEADS × N_BEADS using weighted average pooling.
HIC_PATH       = /path/to/your/contacts.hic
HIC_USE_FORCE  = True
HIC_FORCE_MODE = svd          ; svd | svd_multiscale | crossentropy
HIC_NORMALIZATION = KR        ; KR | VC | VC_SQRT | NONE
HIC_N_COMPONENTS  = 10        ; number of SVD components (svd / svd_multiscale)
HIC_K_SCALE       = 1.0       ; global energy scale [kJ/mol]
HIC_MAX_GAP       = 10        ; % of bins allowed to be empty before warning

; ── Optional loop extrusion (can be combined with Hi-C, but use sparingly) ───
; LOOPS_PATH = /path/to/loops.bedpe

; ── Optional compartment blocks ──────────────────────────────────────────────
; COMPARTMENT_PATH = /path/to/subcompartments.bed

; ── Force field ───────────────────────────────────────────────────────────────
EV_USE_EXCLUDED_VOLUME    = True
POL_USE_HARMONIC_BOND     = True
POL_USE_HARMONIC_ANGLE    = True
LE_USE_HARMONIC_BOND      = False   ; set True only when LOOPS_PATH is given
COB_USE_COMPARTMENT_BLOCKS = False
SC_USE_SPHERICAL_CONTAINER = False
IBL_USE_B_LAMINA_INTERACTION = False
CF_USE_CENTRAL_FORCE       = False

; ── Simulation ────────────────────────────────────────────────────────────────
SIM_RUN_MD      = True
SIM_N_STEPS     = 5000
SIM_SAMPLING_STEP = 50
TRJ_FRAMES      = 100
