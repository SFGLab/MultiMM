[Main]

; ── Platform ──────────────────────────────────────────────────────────────────
PLATFORM = OpenCL

; ── Region of interest ────────────────────────────────────────────────────────
CHROM     = chr1
LOC_START = 10000000
LOC_END   = 28000000

; ── Output ────────────────────────────────────────────────────────────────────
OUT_PATH = results/hic_region

; ── Bead resolution ───────────────────────────────────────────────────────────
N_BEADS = 500
INITIAL_STRUCTURE_TYPE = circle

; ── Hi-C contact force (Boltzmann-inversion PMF — the only restraint type) ────
; Supply a .hic (Juicer) or .cool/.mcool (cooler) file.
; read_hic.py will auto-detect format, pick the best resolution, and
; resize the matrix to N_BEADS × N_BEADS using weighted average pooling.
HIC_PATH            = /path/to/your/contacts.hic
HIC_USE_FORCE        = True
HIC_NORMALIZATION    = KR           ; KR | VC | VC_SQRT | NONE
HIC_K_SCALE          = 40.0         ; global energy scale [kJ/mol] — recommended 20–80
HIC_BOLTZMANN_ALPHA  = 3.0          ; scaling-law exponent, c ~ r^-alpha; typical range 3-4
HIC_BOLTZMANN_KERNEL = exponential  ; exponential (default) | power_law | sigmoid
; HIC_BOLTZMANN_TOL_FRAC = 0.2      ; flat-bottom tolerance (0=default/exact); try 0.15-0.3
;                                   ; if structures look like a hollow spherical shell
; percent of bins allowed to be empty before a warning (kept off the value
; line — an inline "%" there breaks ConfigParser's interpolation on read)
HIC_MAX_GAP          = 10
; HIC_RC              =             ; explicit contact-radius scale [nm]; default: auto-calibrated
; HIC_AUTO_SCALE      = True        ; auto-calibrate HIC_RC from the initial structure
; HIC_FORCE_OE        = False       ; raw contact frequency (default); True = target OE enrichment
; HIC_NOISE_INTENSITY = 0.0         ; per-frame Gaussian noise on c_ij (0 disables)
; HIC_BLOCK_COPOLYMER       = True  ; opt-in (off by default); not suggested at this scale —
; this example is an 18 Mb/TAD-scale region, below the size gate that keeps it useful
; HIC_BLOCK_COPOLYMER_MIN_BP = 5000000  ; min region size (bp) to keep it enabled
; HIC_BLOCK_COPOLYMER_STRENGTH_SCALE = 0.4  ; softens COB_EA/COB_EB for Hi-C-derived
;                                           ; compartments only; 1.0 = full (.bed-like) strength

; ── Optional loop extrusion (can be combined with Hi-C, but use sparingly) ───
; LOOPS_PATH = /path/to/loops.bedpe

; ── Optional compartment blocks ──────────────────────────────────────────────
; COMPARTMENT_PATH = /path/to/subcompartments.bed

; ── Force field ───────────────────────────────────────────────────────────────
EV_USE_EXCLUDED_VOLUME    = True
POL_USE_HARMONIC_BOND     = True
POL_USE_HARMONIC_ANGLE    = True
LE_USE_HARMONIC_BOND      = False   ; set True only when LOOPS_PATH is given
COB_USE_COMPARTMENT_BLOCKS = False
SC_USE_SPHERICAL_CONTAINER = False
IBL_USE_B_LAMINA_INTERACTION = False
CF_USE_CENTRAL_FORCE       = False

; ── Simulation ────────────────────────────────────────────────────────────────
SIM_RUN_MD      = True
SIM_N_STEPS     = 5000
SIM_SAMPLING_STEP = 50
TRJ_FRAMES      = 1000
