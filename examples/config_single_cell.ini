; =============================================================================
; config_single_cell.ini — Single-cell genome-wide simulation
; =============================================================================
;
; Models a full genome from single-cell Hi-C or ChIA-PET loop calls.
; Because single-cell data is sparse, compartment annotations are typically
; unavailable; chromosomal self-compaction and nuclear confinement replace
; them.  Loop distances are treated as fixed (LE_FIXED_DISTANCES = True)
; rather than inferred from Hi-C signal strength.
;
; Recommended use-case
; --------------------
;   You have single-cell contact data (e.g. from Dip-C, scHi-C, or scChIA-PET)
;   formatted as a .bedpe file.  You want one 3D structure per cell.
;
; Typical runtime
; ---------------
;   ~50 000 beads on GPU: 5–20 min for energy minimisation.
;
; Required input files
; --------------------
;   LOOPS_PATH   .bedpe file with single-cell loop/contact pairs
;
; Optional input files
; --------------------
;   COMPARTMENT_PATH  leave blank for single-cell (typically absent)
;   HIC_PATH          leave blank (single-cell contact matrices are very sparse)
; =============================================================================

[Main]

; ── Platform ──────────────────────────────────────────────────────────────────
PLATFORM = OpenCL

; ── Initial structure ─────────────────────────────────────────────────────────
; hilbert — space-filling curve; preserves genomic order for GW runs
INITIAL_STRUCTURE_TYPE = hilbert

; ── Input data ────────────────────────────────────────────────────────────────
FORCEFIELD_PATH  = forcefields/ff.xml

LOOPS_PATH       = /path/to/single_cell_contacts.bedpe

; Typically absent for single-cell data — leave blank or comment out
;COMPARTMENT_PATH =
;ATACSEQ_PATH     =
;HIC_PATH         =

; ── Region (leave blank for full genome) ──────────────────────────────────────
LOC_START =
LOC_END   =
CHROM     =

; ── Output ────────────────────────────────────────────────────────────────────
OUT_PATH = results/single_cell

; ── Bead resolution ───────────────────────────────────────────────────────────
; 50 000 beads ≈ 60 kb/bead for hg38.
N_BEADS = 50000

; ── Chromosome shuffling ──────────────────────────────────────────────────────
SHUFFLE_CHROMS = True
SHUFFLING_SEED = 42

; ── Force field ───────────────────────────────────────────────────────────────

EV_USE_EXCLUDED_VOLUME    = True
EV_FORCE_TYPE             = powerlaw

POL_USE_HARMONIC_BOND     = True
POL_USE_HARMONIC_ANGLE    = True

; Loop extrusion with FIXED distances (single-cell: no Hi-C signal to scale by)
LE_USE_HARMONIC_BOND      = True
LE_LOOP_FORCE_TYPE        = harmonic
LE_FIXED_DISTANCES        = True   ; True → all loop bonds use the same r0

; Nuclear confinement (required for GW single-cell runs)
SC_USE_SPHERICAL_CONTAINER = True
SC_RADIUS1 = 1 nanometer   ; inner (nucleolus-like) radius — needs an explicit unit (OpenMMQuantity)
SC_RADIUS2 = 2 nanometer   ; outer (nuclear envelope)  radius

; Chromosome self-compaction (replaces compartment blocks when no BED file)
CHB_USE_CHROMOSOMAL_BLOCKS = False

; Compartment forces — disabled (no compartment data for single-cell)
COB_USE_COMPARTMENT_BLOCKS    = False
SCB_USE_SUBCOMPARTMENT_BLOCKS = False
IBL_USE_B_LAMINA_INTERACTION  = False

; Nucleolar attraction — size-dependent radial positioning
CF_USE_CENTRAL_FORCE = True
CENTRAL_FORCE_TYPE   = harmonic

; Hi-C contact force — not recommended for sparse single-cell data
HIC_USE_FORCE = False

; ── Nucleosome interpolation ──────────────────────────────────────────────────
NUC_DO_INTERPOLATION = False

; ── Simulation ────────────────────────────────────────────────────────────────
SIM_RUN_MD        = False
SIM_INTEGRATOR_TYPE = langevin
SIM_N_STEPS       = 1000
SIM_SAMPLING_STEP = 50
TRJ_FRAMES        = 100

; ── Ensemble ──────────────────────────────────────────────────────────────────
; For population-level analysis run one config per cell or use GENERATE_ENSEMBLE.
GENERATE_ENSEMBLE = False
N_ENSEMBLE        = 1
