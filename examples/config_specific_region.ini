; =============================================================================
; config_specific_region.ini — TAD / sub-chromosomal region simulation
; =============================================================================
;
; Models a user-defined genomic interval (e.g. a TAD, a gene locus, or an
; entire chromosome arm) at high bead-to-basepair resolution.
; Loop extrusion and optional compartment forces recreate local 3D folding.
;
; Recommended use-case
; --------------------
;   You are interested in the 3D structure of a specific gene, regulatory
;   region, or topologically associating domain (TAD).  You have loop data
;   and optionally compartment annotations and/or ATAC-seq signal.
;
; Typical runtime
; ---------------
;   ~500 beads on CPU: < 1 min.  Scale N_BEADS up for finer resolution.
;
; Required input files
; --------------------
;   LOOPS_PATH   .bedpe file with loop anchors that overlap the target region
;
; Optional input files
; --------------------
;   COMPARTMENT_PATH  .bed  Calder subcompartment labels
;   ATACSEQ_PATH      .bw / .BigWig ATAC-seq for nucleosome interpolation
;   HIC_PATH          .hic / .cool  raw contact matrix for Hi-C force
; =============================================================================

[Main]

; ── Platform ──────────────────────────────────────────────────────────────────
PLATFORM = OpenCL

; ── Region of interest ────────────────────────────────────────────────────────
; Define the chromosome and bp coordinates you want to model.
CHROM     = chr1
LOC_START = 10000000
LOC_END   = 28000000

; ── Initial structure ─────────────────────────────────────────────────────────
; circle  — ring polymer; good starting point for TAD/region runs
; rw      — random walk
INITIAL_STRUCTURE_TYPE = circle

; ── Input data ────────────────────────────────────────────────────────────────
FORCEFIELD_PATH  = forcefields/ff.xml

LOOPS_PATH       = /path/to/loops.bedpe
COMPARTMENT_PATH = /path/to/calder_subcompartments.bed

; Optional: ATAC-seq signal for nucleosome placement after minimisation
ATACSEQ_PATH = /path/to/atac.bw

; Optional: raw Hi-C contact matrix
;HIC_PATH = /path/to/contacts.hic

; ── Output ────────────────────────────────────────────────────────────────────
OUT_PATH = results/region

; ── Bead resolution ───────────────────────────────────────────────────────────
; For a 18 Mb window: 500 beads → 36 kb/bead.
; Increase for finer resolution (e.g. 2000 beads → 9 kb/bead).
N_BEADS = 500

; ── Chromosome shuffling ──────────────────────────────────────────────────────
; For single-region runs, shuffling has no effect; kept here for completeness.
SHUFFLE_CHROMS = False

; ── Force field ───────────────────────────────────────────────────────────────

EV_USE_EXCLUDED_VOLUME    = True
EV_FORCE_TYPE             = powerlaw

POL_USE_HARMONIC_BOND     = True
POL_USE_HARMONIC_ANGLE    = True

; Loop extrusion (requires LOOPS_PATH)
LE_USE_HARMONIC_BOND      = True
LE_LOOP_FORCE_TYPE        = harmonic   ; harmonic | fene_soft | gaussian_tether
LE_FIXED_DISTANCES        = False

; No nuclear container needed for a single region
SC_USE_SPHERICAL_CONTAINER = False

; Chromosome-level compaction not needed for a sub-chromosomal region
CHB_USE_CHROMOSOMAL_BLOCKS = False

; Compartment blocks — enable if COMPARTMENT_PATH is provided
COB_USE_COMPARTMENT_BLOCKS = False
SCB_USE_SUBCOMPARTMENT_BLOCKS = False

; Lamina / central force not relevant at region scale
IBL_USE_B_LAMINA_INTERACTION = False
CF_USE_CENTRAL_FORCE         = False

; Hi-C contact force (requires HIC_PATH) — Boltzmann-inversion PMF
HIC_USE_FORCE        = False
HIC_NORMALIZATION    = KR
HIC_K_SCALE          = 40.0         ; global energy scale [kJ/mol] — recommended 20–80
HIC_BOLTZMANN_ALPHA  = 3.0          ; scaling-law exponent, c ~ r^-alpha; typical range 3-4
HIC_BOLTZMANN_KERNEL = exponential  ; exponential (default) | power_law | sigmoid
; HIC_BOLTZMANN_TOL_FRAC = 0.2      ; flat-bottom tolerance (0=default/exact); try 0.15-0.3
;                                   ; if structures look like a hollow spherical shell
HIC_MAX_GAP          = 10
; HIC_BLOCK_COPOLYMER = True   ; opt-in (off by default); not suggested at this scale —
; a single region is usually TAD-scale and the size gate (HIC_BLOCK_COPOLYMER_MIN_BP)
; disables it anyway; better suited to whole-chromosome/genome-wide runs

; ── Nucleosome interpolation (post-processing) ────────────────────────────────
NUC_DO_INTERPOLATION = True

; ── Simulation ────────────────────────────────────────────────────────────────
SIM_RUN_MD        = True
SIM_INTEGRATOR_TYPE = langevin
SIM_N_STEPS       = 1000
SIM_SAMPLING_STEP = 50
TRJ_FRAMES        = 1000
