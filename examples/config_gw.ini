; =============================================================================
; config_gw.ini — Genome-wide (GW) simulation
; =============================================================================
;
; Models the full human genome at ~10–50 kb resolution in a single run.
; All chromosomes are included as one continuous polymer chain and are placed
; inside a spherical nuclear container.  Compartment identity, lamina
; affinity, chromosome self-compaction, and nucleolar attraction are all
; active to reproduce known large-scale nuclear organisation.
;
; Recommended use-case
; --------------------
;   You have population-average Hi-C-derived loop calls and subcompartment
;   annotations for a cell line and want a 3D genome model of the whole nucleus.
;
; Typical runtime
; ---------------
;   ~500 000 beads on a modern GPU (OpenCL/CUDA): 30–90 min for energy
;   minimisation; MD disabled by default (set SIM_RUN_MD = True to anneal).
;
; Required input files
; --------------------
;   LOOPS_PATH        .bedpe file with loop anchors (e.g. HiCCUPS output)
;   COMPARTMENT_PATH  .bed  file with Calder subcompartment labels (A1/A2/B1/B2)
;
; Optional input files
; --------------------
;   ATACSEQ_PATH      .bw / .BigWig ATAC-seq signal for nucleosome interpolation
;   HIC_PATH          .hic / .cool  raw contact matrix for Hi-C force
; =============================================================================

[Main]

; ── Platform ──────────────────────────────────────────────────────────────────
; Available: OpenCL  CUDA  CPU  Reference
PLATFORM = OpenCL

; ── Initial structure ─────────────────────────────────────────────────────────
; hilbert  — space-filling curve; best for GW (preserves chromosome order)
; rw       — random walk (faster to build, good for ensembles)
INITIAL_STRUCTURE_TYPE = hilbert

; ── Input data ────────────────────────────────────────────────────────────────
FORCEFIELD_PATH  = forcefields/ff.xml

LOOPS_PATH       = /path/to/HiCCUPS_loops.bedpe
COMPARTMENT_PATH = /path/to/calder_subcompartments.bed

; Optional: ATAC-seq bigWig for nucleosome interpolation (post-processing)
;ATACSEQ_PATH    = /path/to/atac.bw

; Optional: raw Hi-C contact matrix to add a contact-guided force
;HIC_PATH        = /path/to/contacts.hic

; ── Region (leave blank for full genome) ──────────────────────────────────────
LOC_START =
LOC_END   =
CHROM     =

; ── Output ────────────────────────────────────────────────────────────────────
OUT_PATH = results/gw

; ── Bead resolution ───────────────────────────────────────────────────────────
; 500 000 beads ≈ 6 kb/bead for hg38.  Reduce for faster runs or less RAM.
N_BEADS = 500000

; ── Chromosome shuffling ──────────────────────────────────────────────────────
; True → randomise chromosome order before building the initial structure.
; Useful for ensemble generation.
SHUFFLE_CHROMS = True
SHUFFLING_SEED = 0

; Probability of downsampling loop contacts (1.0 = keep all)
DOWNSAMPLING_PROB = 1.0

; ── Force field ───────────────────────────────────────────────────────────────

; Excluded volume: keeps beads from overlapping
EV_USE_EXCLUDED_VOLUME    = True
EV_FORCE_TYPE             = powerlaw   ; powerlaw | gaussian_core

; Polymer backbone bonds and stiffness
POL_USE_HARMONIC_BOND     = True
POL_USE_HARMONIC_ANGLE    = True

; Loop extrusion bonds (requires LOOPS_PATH)
LE_USE_HARMONIC_BOND      = True
LE_LOOP_FORCE_TYPE        = harmonic   ; harmonic | fene_soft | gaussian_tether
LE_FIXED_DISTANCES        = False      ; False → bond strength ∝ Hi-C signal

; Spherical nuclear container (essential for GW simulations)
SC_USE_SPHERICAL_CONTAINER = True

; Chromosome-level self-compaction into globules
CHB_USE_CHROMOSOMAL_BLOCKS = True
CHB_FORCE_TYPE             = polynomial  ; polynomial | gaussian | saturating

; Compartment A/B phase separation (requires COMPARTMENT_PATH)
COB_USE_COMPARTMENT_BLOCKS = False  ; set True if you have A/B annotations only
COB_FORCE_TYPE             = gaussian

; Subcompartment A1/A2/B1/B2 phase separation (requires COMPARTMENT_PATH)
SCB_USE_SUBCOMPARTMENT_BLOCKS = True
SCB_FORCE_TYPE                = gaussian

; B-compartment lamina affinity (requires COMPARTMENT_PATH)
IBL_USE_B_LAMINA_INTERACTION = True
BLAMINA_FORCE_TYPE           = sin   ; sin | gaussian_shell | harmonic_shell | logistic_shell

; Nucleolar attraction (size-dependent chromosome radial positioning)
CF_USE_CENTRAL_FORCE  = True
CENTRAL_FORCE_TYPE    = harmonic   ; harmonic | gaussian | logistic

; Hi-C contact force (requires HIC_PATH) — Boltzmann-inversion PMF
HIC_USE_FORCE        = False
HIC_NORMALIZATION    = KR
HIC_K_SCALE          = 40.0         ; global energy scale [kJ/mol] — recommended 20–80
HIC_BOLTZMANN_ALPHA  = 3.0          ; scaling-law exponent, c ~ r^-alpha; typical range 3-4
HIC_BOLTZMANN_KERNEL = exponential  ; exponential (default) | power_law | sigmoid
; HIC_BOLTZMANN_TOL_FRAC = 0.2      ; flat-bottom tolerance (0=default/exact); try 0.15-0.3
;                                   ; if structures look like a hollow spherical shell
HIC_MAX_GAP          = 10
; HIC_BLOCK_COPOLYMER = True   ; opt-in (off by default); suggested here since this is a
; genome-wide run with no compartment .bed — errors if enabled together with
; COB_USE_COMPARTMENT_BLOCKS/SCB_USE_SUBCOMPARTMENT_BLOCKS above

; ── Nucleosome interpolation (post-processing, requires ATACSEQ_PATH) ─────────
NUC_DO_INTERPOLATION = True

; ── Simulation ────────────────────────────────────────────────────────────────
; Energy minimisation always runs.  MD annealing is optional.
SIM_RUN_MD        = False
SIM_INTEGRATOR_TYPE = langevin
SIM_N_STEPS       = 1000
SIM_SAMPLING_STEP = 50
TRJ_FRAMES        = 1000

; ── Ensemble ──────────────────────────────────────────────────────────────────
; Set GENERATE_ENSEMBLE = True to produce N_ENSEMBLE independent structures.
; Recommended to use INITIAL_STRUCTURE_TYPE = rw for ensemble runs.
GENERATE_ENSEMBLE = False
N_ENSEMBLE        = 10
